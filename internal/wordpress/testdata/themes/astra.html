<!DOCTYPE html>
<html><head>
<link rel="stylesheet" id="astra-google-fonts-css" href="https://fonts.googleapis.com/css?family=Inter%3A400%7CPlus+Jakarta+Sans%3A600&#038;display=fallback" media="all">
<style id="astra-theme-css-inline-css">
html{font-size:112.5%}
:root{--ast-global-color-0:#060097;--ast-global-color-2:#1e293b;--ast-global-color-3:#67768e;--ast-global-color-4:#f9f6fe;--ast-global-color-7:#ffcd57;--wp--custom--ast-content-width-size:1200px}
a{color:var(--ast-global-color-0)}
.ast-separate-container{background-color:var(--ast-global-color-4);background-image:none;}
body,button,input,select,textarea,.ast-button,.ast-custom-button{font-family:'Inter',sans-serif;font-size:18px;font-size:1rem}
h1,h2,h3,h4,h5,h6,.entry-content :where(h1,h2,h3,h4,h5,h6),.site-title,.site-title a{font-family:'Plus Jakarta Sans',sans-serif}
h1,.entry-content :where(h1){font-size:64px;font-size:3.5555555555556rem;font-family:'Plus Jakarta Sans',sans-serif}
body,h1,h2,h3,h4,h5,h6,.entry-title a,.entry-content :where(h1,h2,h3,h4,h5,h6){color:var(--ast-global-color-3)}
button,.ast-button,.button,input[type="button"],input[type="reset"],input[type="submit"],a:where(.wp-block-button__link){border-radius:4px}
.menu-toggle,button,.ast-button,.ast-custom-button,.button,input#submit,input[type="button"],input[type="submit"],input[type="reset"],#comments .submit,.search .search-submit,form[CLASS*="wp-block-search__"].wp-block-search .wp-block-search__inside-wrapper .wp-block-search__button,body .wp-block-file .wp-block-file__button,.search .search-submit{color:var(--ast-global-color-2);background-color:var(--ast-global-color-7);font-family:inherit;font-size:20px;font-size:1.1111111111111rem}
h1,h2,h3,h4,h5,h6,.entry-content :where(h1,h2,h3,h4,h5,h6){color:var(--ast-global-color-2)}
</style>
<style id="global-styles-inline-css">
:root{--wp--style--global--content-size:var(--wp--custom--ast-content-width-size)}
:root :where(.wp-element-button, .wp-block-button__link){background-color:#32373c;color:#fff;font-family:inherit;font-size:inherit}
</style>
</head><body></body></html>
