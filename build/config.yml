# The generated icons and metadata don't follow `info` or `fileAssociations` by themselves.
# Run `wails3 task common:update:build-assets` after changing them.
# It overwrites hand edits in build/, such as the homepage in linux/nfpm/nfpm.yaml.
version: '3'

info:
  companyName: "Pageroom"
  productName: "Pageroom"
  productIdentifier: "io.github.myrheimb.pageroom"
  description: "Desktop CMS for Hugo"
  copyright: "Copyright © 2026 Bjørnar Myrheim"
  comments: "Desktop CMS for Hugo"
  version: "0.2.1"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - bin
      - frontend
      - node_modules
    file:
      - "*_test.go"
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
