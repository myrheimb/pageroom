<!DOCTYPE html>
<html><head>
<style id="classic-theme-styles-inline-css">
.wp-block-button__link{color:#fff;background-color:#32373c;border-radius:9999px;font-size:1.125em}
</style>
<style id="generate-style-inline-css">
:root{--accent:#1e73be;--base-2:#f7f8f9;--contrast:#222222}
body{background-color:var(--base-2);color:var(--contrast)}
a{color:var(--accent)}
button,html input[type="button"],input[type="reset"],input[type="submit"],a.button,a.wp-block-button__link:not(.has-background){color:#ffffff;background-color:#55555e}
</style>
</head><body></body></html>
