<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ "/" | relURL }}">{{ with site.Params.logo }}<img src="{{ . | relURL }}" alt="">{{ end }}<span>{{ site.Title }}</span></a>
    {{ $current := . }}
    {{ with site.Menus.main }}
    <button class="menu-button" type="button" popovertarget="site-nav">{{ i18n "menu" }}</button>
    <nav class="site-nav" id="site-nav" popover aria-label="{{ i18n "mainMenu" }}">
      <ul>
        {{ range . }}
        <li{{ if .HasChildren }} class="has-children"{{ end }}>
          <a href="{{ .URL }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
          {{ if .HasChildren }}<ul>{{ range .Children }}<li><a href="{{ .URL }}"{{ if $current.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>{{ end }}</ul>{{ end }}
        </li>
        {{ end }}
      </ul>
    </nav>
    {{ end }}
  </div>
</header>
