<style>
.pr-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); gap: 1.25rem; margin: 2rem 0; }
.pr-card { box-sizing: border-box; min-width: 0; padding: 1.25rem; border: 1px solid color-mix(in srgb, currentColor 18%, transparent); border-radius: .75rem; background: color-mix(in srgb, currentColor 5%, transparent); overflow-wrap: anywhere; }
.pr-card > :first-child { margin-top: 0; }
.pr-card > :last-child { margin-bottom: 0; }
.pr-card img { max-width: 100%; height: auto; }
</style>
<div class="pr-cards"{{ with .Get "align" }} style="text-align: {{ . }}"{{ end }}>
{{ .Inner }}
</div>
