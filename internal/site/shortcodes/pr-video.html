{{- $inColumn := and .Parent (eq .Parent.Name "pr-column") -}}
{{- if $inColumn }}{{ "<!--pr-button-->" | safeHTML }}{{ end -}}
{{- if not (.Page.Store.Get "pr-video-css") }}{{ .Page.Store.Set "pr-video-css" true -}}
<style>
.pr-video { display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 16 / 9; margin: 1.5rem 0; border: 0; }
</style>
{{ end -}}
<iframe class="pr-video" src="https://www.youtube-nocookie.com/embed/{{ .Get "id" }}" title="YouTube video player" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
{{- if $inColumn }}{{ "<!--/pr-button-->" | safeHTML }}{{ end }}
